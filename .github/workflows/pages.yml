name: Deploy to GitHub Pages

# Builds the site, runs the end-to-end checks (including the offline reload),
# and publishes public/ to the gh-pages branch, which GitHub Pages serves at
# https://kennethkimbrough.github.io/outage-ready/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Offline check with Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --project=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: Kenneth Kimbrough
          user_email: 146112017+kennethkimbrough@users.noreply.github.com
          commit_message: "Deploy site"

  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the site to answer
        run: |
          url="https://kennethkimbrough.github.io/outage-ready/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && curl -s "$url" | grep -q "Outage Ready"; then
              echo "::notice title=Live site::$url is serving the app (HTTP 200)"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Live site::$url did not return the app (last HTTP $code). Enable GitHub Pages from the gh-pages branch in Settings > Pages."
          exit 1
